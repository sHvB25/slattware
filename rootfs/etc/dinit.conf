# dinit.conf — настройки dinit.
#
# Поддерживаются ТОЛЬКО эти ключи: log-type, log-file, log-level.
# Настройки вроде bootcmd или shutdown-hook из других систем инициализации
# dinit не знает: молчаливый игнор выглядел бы как «скрипт выполняется»,
# а выполняется он из отдельного сервиса /etc/dinit.d/rc.
#
# Всё остальное задаётся в файлах сервисов /etc/dinit.d/*.

# Куда писать логи сервисов.
#   none  — только консоль (удобно при отладке)
#   file  — в log-file
log-type = none


# Уровень: error, warning, info, debug
log-level = info
